server:
  port: 8888
cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://www.erudio.com.br
file:
  # inside target/ so the tests do not write to the drive root; wiped by "mvn clean"
  upload-dir: target/test-uploads
security:
  jwt:
    token:
      secret-key: 53cr37
      expire-lenght: 3600000
email:
  subject: "Default Subject"
  message: "Default Message"
spring:
  application:
    name: rest-with-spring-boot-and-java-erudio
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    # Jackson 3 changed several defaults (property order, date format); keep the Jackson 2 output
    use-jackson2-defaults: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Hibernate switches this check off by itself when Bean Validation is on the classpath (springdoc 3 brings it)
        check_nullability: true
    show-sql: false
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enabled: true
      mail.smtp.starttls.required: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215 MB
logging:
  level:
    root: INFO
    # root: WARN
    # br.com.erudio: DEBUG
springdoc:
  api-docs:
    # springdoc 3 generates OpenAPI 3.1 by default; keep the 3.0 document that was served before
    version: openapi_3_0
  paths-to-match:
    - /auth/**
    - /api/**/v1/**
  swagger-ui:
    use-root-path: true